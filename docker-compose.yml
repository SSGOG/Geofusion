services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geofusion-postgis
    environment:
      POSTGRES_DB: geofusion
      POSTGRES_USER: geofusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geofusion_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - geofusion_postgis:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofusion -d geofusion"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  geofusion_postgis:
